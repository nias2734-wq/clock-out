# CI: 앱(app/) 타입 검사·테스트·번들 빌드와 플러그인(루트) 타입 검사·검증·테스트
# 설치 파일(npm run dist)은 만들지 않음 | 서명·배포는 아직 수동
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 같은 브랜치에 새 커밋이 오면 앞선 실행은 취소
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: app (tsc · vitest · build)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npx tsc --noEmit -p .

      # app/shared/timeline.ts 와 hooks/timeline.ts 가 다르면 여기서 실패함(timeline.spec.ts)
      - name: Tests (vitest)
        run: npx vitest run

      - name: Bundle build (electron-vite)
        run: npx electron-vite build

      # 루트 package.json 이 기준 | 의존성 없이 node 로만 돎
      - name: Version check
        working-directory: .
        run: node scripts/version.js --check

  plugin:
    name: plugin (Claude Code ${{ matrix.claude-code }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # README 에 적은 검증 버전 | 실패하면 CI 실패
          - claude-code: '2.1.304'
            experimental: false
          # 새 릴리스 미리 보기 | 플러그인 API 가 early access 라 깨질 수 있어 실패해도 CI 는 통과
          - claude-code: latest
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    env:
      # 설치한 버전 그대로 돌게 함
      DISABLE_AUTOUPDATER: '1'
      # Windows 의 Claude Code 가 쓰는 Git Bash | 러너에 Git for Windows 가 이 경로로 깔려 있음
      CLAUDE_CODE_GIT_BASH_PATH: C:\Program Files\Git\bin\bash.exe
    # 러너에는 Claude 로그인이 없음 | validate·test·타입 생성은 로그인 없이 됨(2.1.304 에서 실측)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: npm ci (TypeScript)
        run: npm ci --no-audit --no-fund

      - name: Install Claude Code CLI
        run: |
          npm i -g @anthropic-ai/claude-code@${{ matrix.claude-code }} --no-audit --no-fund
          claude --version

      # .claude-plugin/types/ 는 git 에 없음 | Claude Code 가 플러그인을 불러올 때 씀(scripts/types.js)
      - name: Plugin API types
        run: npm run types

      - name: Type check
        run: npx tsc -p .

      - name: Validate plugin
        run: claude plugin validate .

      - name: Tests (claude plugin test)
        run: claude plugin test .
